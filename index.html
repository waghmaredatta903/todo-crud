<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>firebase todo crud-1</title>
    <style>
        body {
            background-color: rgb(45, 63, 57);

        }

        .card {
            border-radius: 5%;
        }

        .spinner {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(255, 255, 255, .8);
            display: flex;
            justify-content: center;
            align-items: center;


        }
    </style>
</head>

<body>
    <h2 class="bg-warning text-black text-center">FIREBASE TODO CRUD-1</h2>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h4 class="bg-danger border-radius text-black text-center">Todo Input..!!</h4>
                        <form id="todoForm">
                            <div class="form-group">
                                <label for="inputControl">ENTER-TODO*</label>
                                <input type="text" class="form-control" id="inputControl" autocomplete="off" required>
                            </div>
                            <button id="addtodoBtn" class="btn btn-outline-primary btn-block">Add Todo</button>
                            <button id="updatetodoBtn" type="button"
                                class="btn btn-outline-success btn-block d-none">Update Todo</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h3 class="bg-success text-black text-center">LIST TODO!!</h3>
                        <ul class="list-group" id="todocontainer">
                            <!-- <li class="list-group-item d-flex justify-content-between">
                                <strong>html</strong>
                                <div>
                                    <i class="fa-regular fa-pen-to-square fa-2x text-primary"></i>
                                    <i class="fa-solid fa-trash fa-2x text-danger"></i>
                                </div>
                            </li> -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-warning" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
